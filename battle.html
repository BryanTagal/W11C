
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Battle Arena</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 18px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: linear-gradient(135deg, #111827, #263b63);
        }

        main {
            max-width: 1000px;
            margin: auto;
        }

        h1, .status {
            text-align: center;
        }

        .arena {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            margin-top: 28px;
        }

        .fighter {
            background: #ffffff;
            color: #172033;
            border-radius: 18px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 12px 30px #00000030;
        }

        .fighter img {
            width: min(100%, 190px);
            height: 170px;
            object-fit: contain;
        }

        .health-track {
            height: 14px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }

        .health-fill {
            height: 100%;
            width: 100%;
            background: #22c55e;
            transition: width 0.25s;
        }

        .attacks {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, a {
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            background: #ef4444;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .secondary {
            background: #475569;
        }

        .log {
            margin-top: 24px;
            padding: 20px;
            border-radius: 14px;
            background: #ffffff12;
            border: 1px solid #ffffff30;
            min-height: 80px;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        @media (max-width: 600px) {
            .arena {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Pokémon Battle Arena</h1>
        <p id="battle-status" class="status">Loading battle...</p>

        <section class="arena">
            <article class="fighter">
                <h2 id="user-name">Your Pokémon</h2>
                <img id="user-image" alt="Your Pokémon">
                <p id="user-hp">HP: 100 / 100</p>
                <div class="health-track">
                    <div id="user-health-bar" class="health-fill"></div>
                </div>
                <h3>Your Attacks</h3>
                <div id="attacks" class="attacks"></div>
            </article>

            <article class="fighter">
                <h2 id="computer-name">Enemy Pokémon</h2>
                <img id="computer-image" alt="Enemy Pokémon">
                <p id="computer-hp">HP: 100 / 100</p>
                <div class="health-track">
                    <div id="computer-health-bar" class="health-fill"></div>
                </div>
            </article>
        </section>

        <section class="log">
            <strong>Battle Log</strong>
            <div id="battle-log" aria-live="polite">The battle is about to begin!</div>
        </section>

        <div class="actions">
            <a class="secondary" href="index.html">Home</a>
            <button id="new-battle">Start New Battle</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
