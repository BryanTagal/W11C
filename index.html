
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Battle - Choose Your Pokémon</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 18px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: linear-gradient(135deg, #101827, #172554, #111827);
        }

        main {
            max-width: 1000px;
            margin: auto;
        }

        h1, .subtitle {
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 8px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        #pokemon-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
        }

        .pokemon-card {
            padding: 22px;
            text-align: center;
            border: 1px solid #334155;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .pokemon-card img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .type {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            color: #e2e8f0;
            font-size: 13px;
        }

        button, .resume-link {
            display: inline-block;
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            color: #0f172a;
            background: #67e8f9;
        }

        button:hover, .resume-link:hover {
            background: #a5f3fc;
        }

        #message, #resume-area {
            text-align: center;
            margin-top: 24px;
        }

        #message {
            color: #fcd34d;
        }

        #resume-area .resume-link {
            margin: 8px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Pokémon Battle</h1>
        <p class="subtitle">Choose your Pokémon and prepare for battle!</p>

        <section id="pokemon-list" aria-label="Available Pokémon"></section>
        <p id="message" role="status"></p>
        <div id="resume-area"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
